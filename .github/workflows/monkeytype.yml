name: Update Monkeytype Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Monkeytype SVG
        env:
          MONKEYTYPE_API_KEY: ${{ secrets.MONKEYTYPE_API_KEY }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          API = "https://api.monkeytype.com"
          key = os.environ.get("MONKEYTYPE_API_KEY")

          if not key:
              raise SystemExit("MONKEYTYPE_API_KEY is not configured.")

          def api(path):
              req = urllib.request.Request(
                  API + path,
                  headers={
                      "Authorization": f"ApeKey {key}",
                      "Accept": "application/json",
                  },
              )

              with urllib.request.urlopen(req, timeout=20) as response:
                  return json.load(response)

          print("Fetching Monkeytype statistics...")

          stats = api("/users/stats")

          data = stats.get("data", {})

          if not data:
              raise SystemExit("Monkeytype returned no statistics.")

          completed = data.get("completedTests", 0)
          time_typing = data.get("timeTyping", 0)

          # Try to obtain the user's best 60-second result.
          pb = api("/users/personalBests?mode=time")

          pb_data = pb.get("data", {})

          best = None

          if isinstance(pb_data, dict):
              mode_data = pb_data.get("time", pb_data)

              if isinstance(mode_data, dict):
                  best = mode_data.get("60")

              if isinstance(mode_data, list) and mode_data:
                  best = mode_data[0]

          if not isinstance(best, dict):
              best = {}

          wpm = float(best.get("wpm", 0) or 0)
          raw = float(best.get("raw", 0) or 0)
          acc = float(best.get("acc", 0) or 0)
          consistency = float(best.get("consistency", 0) or 0)

          wpm = round(wpm, 1)
          raw = round(raw, 1)
          acc = round(acc, 1)
          consistency = round(consistency, 1)

          def fmt_time(seconds):
              try:
                  seconds = int(seconds)
                  hours = seconds // 3600
                  minutes = (seconds % 3600) // 60

                  if hours:
                      return f"{hours}h {minutes}m"

                  return f"{minutes}m"
              except Exception:
                  return "—"

          svg = f'''<svg width="900" height="270"
          viewBox="0 0 900 270"
          xmlns="http://www.w3.org/2000/svg">

            <defs>
              <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#111111"/>
                <stop offset="100%" stop-color="#1b1b1b"/>
              </linearGradient>

              <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0%" stop-color="#e2b714"/>
                <stop offset="100%" stop-color="#f5d76e"/>
              </linearGradient>
            </defs>

            <rect
              x="1"
              y="1"
              width="898"
              height="268"
              rx="22"
              fill="url(#bg)"
              stroke="#2d2d2d"
              stroke-width="2"
            />

            <circle
              cx="810"
              cy="45"
              r="90"
              fill="#e2b714"
              opacity="0.035"
            />

            <circle
              cx="850"
              cy="220"
              r="130"
              fill="#e2b714"
              opacity="0.025"
            />

            <text
              x="45"
              y="55"
              fill="#888888"
              font-family="monospace"
              font-size="14"
              letter-spacing="2">
              MONKEYTYPE
            </text>

            <text
              x="45"
              y="93"
              fill="#ffffff"
              font-family="Arial, sans-serif"
              font-size="30"
              font-weight="700">
              emailosman
            </text>

            <rect
              x="45"
              y="112"
              width="810"
              height="1"
              fill="#303030"
            />

            <text x="45" y="157"
              fill="#777777"
              font-family="Arial, sans-serif"
              font-size="13">
              PERSONAL BEST
            </text>

            <text x="45" y="205"
              fill="url(#accent)"
              font-family="Arial, sans-serif"
              font-size="48"
              font-weight="700">
              {wpm} WPM
            </text>

            <text x="260" y="157"
              fill="#777777"
              font-family="Arial, sans-serif"
              font-size="13">
              ACCURACY
            </text>

            <text x="260" y="190"
              fill="#ffffff"
              font-family="Arial, sans-serif"
              font-size="24"
              font-weight="600">
              {acc}%
            </text>

            <text x="390" y="157"
              fill="#777777"
              font-family="Arial, sans-serif"
              font-size="13">
              CONSISTENCY
            </text>

            <text x="390" y="190"
              fill="#ffffff"
              font-family="Arial, sans-serif"
              font-size="24"
              font-weight="600">
              {consistency}%
            </text>

            <text x="545" y="157"
              fill="#777777"
              font-family="Arial, sans-serif"
              font-size="13">
              RAW
            </text>

            <text x="545" y="190"
              fill="#ffffff"
              font-family="Arial, sans-serif"
              font-size="24"
              font-weight="600">
              {raw}
            </text>

            <text x="665" y="157"
              fill="#777777"
              font-family="Arial, sans-serif"
              font-size="13">
              TESTS
            </text>

            <text x="665" y="190"
              fill="#ffffff"
              font-family="Arial, sans-serif"
              font-size="24"
              font-weight="600">
              {completed}
            </text>

            <text x="45" y="238"
              fill="#555555"
              font-family="Arial, sans-serif"
              font-size="12">
              {fmt_time(time_typing)} total typing time · 60 second mode
            </text>

            <text x="855" y="238"
              text-anchor="end"
              fill="#555555"
              font-family="monospace"
              font-size="11">
              LIVE DATA
            </text>

          </svg>'''

          path = Path("assets/monkeytype.svg")
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(svg, encoding="utf-8")

          print("Generated:", path)
          print(f"WPM: {wpm}")
          print(f"Accuracy: {acc}%")
          print(f"Consistency: {consistency}%")
          print(f"Tests: {completed}")

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/monkeytype.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Monkeytype stats"
            git push
          fi