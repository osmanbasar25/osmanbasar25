name: Update Monkeytype Stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  monkeytype:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Monkeytype stats
        uses: monkeytype-hub/monkeytype-readme@v1.0.0
        with:
          username: emailosman
          github-token: ${{ secrets.GITHUB_TOKEN }}